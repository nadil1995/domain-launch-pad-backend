name: restaurant_app
description: "Smart Restaurant Discovery & Menu Experience Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.3.0

  # Maps
  # flutter_mapbox_gl: ^0.0.2  # TODO: integrate Mapbox in Phase 2.7

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^12.0.0

  # Image & Media
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1

  # Location
  geolocator: ^11.0.0

  # Auth
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^5.0.0

  # Storage
  flutter_secure_storage: ^9.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

